<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anymus-PC Detalles del Anime</title>

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
/* BOTÓN VOLVER PREMIUM */
.back-btn{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid #333;
  background:#111;
  color:#ccc;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:.2s ease;
}

.back-btn:hover{
  border-color:#00bfff;
  color:#fff;
}

/* ===== CONTENEDOR ===== */
.detail-container{
  max-width:1100px;
  margin:60px auto;
  padding:40px;
  background:#141414;
  border:1px solid #262626;
  border-radius:14px;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* ===== TOP ===== */
.detail-top{
  display:flex;
  gap:50px;
  flex-wrap:wrap;
}

.detail-image img{
  width:300px;
  border-radius:12px;
  box-shadow:0 15px 35px rgba(0,0,0,0.6);
}

.detail-info{
  flex:1;
  min-width:280px;
}

.detail-info h2{
  font-size:30px;
  margin-bottom:25px;
  letter-spacing:0.5px;
}

/* ===== INFO GRID ===== */
.info-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(150px,1fr));
  gap:20px 40px;
  margin-bottom:25px;
}

.info-item span{
  display:block;
  font-size:12px;
  color:#888;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.info-item strong{
  font-size:15px;
  color:#fff;
}

/* ===== SINOPSIS ===== */
.sinopsis{
  margin-top:15px;
  line-height:1.7;
  color:#bbb;
  max-width:650px;
}

/* ===== BOTÓN COMPLETO ===== */
.detail-info button{
  margin-top:15px;
  padding:8px 18px;
  font-size:14px;
  border-radius:8px;
}

/* ===== SEPARADOR ===== */
.section-divider{
  margin:60px 0 30px 0;
  border-top:1px solid #222;
}

/* ===== TEMPORADAS ===== */
.seasons-wrapper{
  max-width:1000px;
  margin:auto;
}

.seasons-wrapper h3{
  margin-bottom:20px;
  font-size:18px;
  letter-spacing:0.5px;
}

.seasons-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

.seasons-table th{
  text-align:left;
  padding:14px 8px;
  border-bottom:2px solid #333;
  font-weight:500;
  color:#888;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:0.5px;
}

.seasons-table td{
  padding:16px 8px;
  border-bottom:1px solid #1f1f1f;
  vertical-align:middle;
}

.seasons-table tr{
  transition:.2s ease;
}

/* Hover lateral elegante */
.seasons-table tr:hover{
  background:transparent;
  border-left:3px solid #00bfff;
}

/* Botones temporadas */
.seasons-table button{
  padding:6px 14px;
  font-size:13px;
  border-radius:6px;
  transition:.2s;
}

/* ===== CARRITO ===== */
.cart-modal {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.cart-modal-content {
  background:#1a1a1a;
  color:#fff;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:400px;
  max-height:80%;
  overflow-y:auto;
  border:1px solid #2a2a2a;
}

.cart-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
  font-size:14px;
}

.cart-item button {
  background:#ff4d4d;
  border:none;
  color:#fff;
  padding:2px 6px;
  border-radius:4px;
  cursor:pointer;
}

.added {
  background:#444 !important;
  cursor:not-allowed !important;
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">
    <h1 class="logo-title">⚡ANYMUS PC</h1>
    <span class="logo-sub">Detalles del Anime</span>
  </div>

  <button class="back-btn" onclick="history.back()">
    <i class="ri-arrow-left-line"></i> Volver
  </button>

  <button id="cartBtn" class="cart-btn">
    <i class="ri-shopping-cart-2-line"></i>
    <span id="cartCount" class="cart-count">0</span>
  </button>
</header>

<main id="detailContainer"></main>

<!-- CARRITO -->
<div class="cart-modal" id="cartModal">
  <div class="cart-modal-content">
    <h2>🛒 Tu Carrito</h2>
    <div id="cartItems"></div>
    <p>Total GB: <span id="totalGb">0</span></p>
    <p>Total: <span id="totalPrice">0</span> CUP</p>
    <button class="btn-primary" id="whatsappBtn">📲 Comprar</button>
    <button class="btn-secondary" onclick="closeCart()">❌ Cerrar</button>
    <button class="btn-secondary" onclick="clearCart()">🗑️ Vaciar</button>
  </div>
</div>

<script src="data.js"></script>
<script src="cart.js"></script>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  const params = new URLSearchParams(window.location.search);
  const letter = params.get("letter");
  const id = params.get("id");
  const anime = animeData[letter][id];
  const container = document.getElementById("detailContainer");

  const totalSeasons = anime.seasons.length;
  const totalEpisodes = anime.seasons.reduce((a,s)=>a+(s.episodes||0),0);
  const totalGb = anime.seasons.reduce((a,s)=>a+s.gb,0);

  let seasonsRows = "";

  anime.seasons.forEach((season,index)=>{
    seasonsRows += `
      <tr>
        <td>Temporada ${index+1}</td>
        <td>${season.gb} GB</td>
        <td>${season.episodes || "?"}</td>
        <td>${season.price || 0} CUP</td>
        <td>
          <button class="btn-primary"
            data-name="${anime.title} - Temporada ${index+1}"
            onclick="addToCart(
              {name:'${anime.title} - Temporada ${index+1}', gb:${season.gb}, price:${season.price || 0}},
              this
            )">
            Agregar
          </button>
        </td>
      </tr>
    `;
  });

  container.innerHTML = `
    <div class="detail-container">
      <div class="detail-top">
        <div class="detail-image">
          <img src="${anime.image}">
        </div>

        <div class="detail-info">
          <h2>${anime.title}</h2>

          <div class="info-grid">
            <div class="info-item">
              <span>Año</span>
              <strong>${anime.year}</strong>
            </div>
            <div class="info-item">
              <span>Género</span>
              <strong>${anime.genre}</strong>
            </div>
            <div class="info-item">
              <span>Temporadas</span>
              <strong>${totalSeasons}</strong>
            </div>
            <div class="info-item">
              <span>Capítulos</span>
              <strong>${totalEpisodes}</strong>
            </div>
            <div class="info-item">
              <span>GB Totales</span>
              <strong>${totalGb}</strong>
            </div>
            <div class="info-item">
              <span>Precio Completo</span>
              <strong>${anime.basePrice} CUP</strong>
            </div>
          </div>

          <div class="sinopsis">
            ${anime.synopsis}
          </div>

          <button class="btn-primary"
            data-name="${anime.title} (Completo)"
            onclick="addToCart(
              {name:'${anime.title} (Completo)', gb:${totalGb}, price:${anime.basePrice}},
              this
            )">
            Agregar Completo
          </button>
        </div>
      </div>

      <div class="section-divider"></div>

      <div class="seasons-wrapper">
        <h3>Temporadas Disponibles</h3>

        <table class="seasons-table">
          <thead>
            <tr>
              <th>Temporada</th>
              <th>GB</th>
              <th>Capítulos</th>
              <th>Precio</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${seasonsRows}
          </tbody>
        </table>
      </div>
    </div>
  `;

  updateCartCount();
  syncButtons();
});
</script>

</body>
</html>
